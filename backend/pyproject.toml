[project]
name = "followroom-backend"
version = "0.0.1"
description = "FollowRoom backend — FastAPI + AI pipeline"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "supabase>=2.9.0",
    "httpx>=0.27.0",
    "anthropic>=0.39.0",
    "openai>=1.55.0",
    "instructor>=1.6.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "assemblyai>=0.30.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates contain long natural-language instructions where
# breaking lines mid-sentence harms readability and risks subtle
# tokenization changes. Tests use long mock chains / inline fixtures
# that read better as single statements.
"app/ai/prompts/*.py" = ["E501"]
"tests/*.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

# supabase-py's PostgREST client returns loosely-typed JSON
# (str | int | float | Sequence[JSON] | Mapping[str, JSON] | None) from
# .execute().data, which collides with strict mode at every read site.
# We relax strict checks in modules that wrap supabase responses — the
# Pydantic models at the API boundary (FactResponse, ProfileResponse, etc.)
# still validate shape at runtime. When we introduce a typed wrapper
# around supabase reads (Phase 3 candidate), these overrides can shrink.
[[tool.mypy.overrides]]
module = [
    "app.api.clients",
    "app.api.facts",
    "app.api.operators",
    "app.api.profile",
    "app.services.store",
    "app.services.extraction_pipeline",
    "app.services.ingestion_worker",
    "app.services.storage",
    "app.ai.extraction",
    "app.ai.profile",
    "app.ai.providers.anthropic",
]
disallow_untyped_calls = false
warn_return_any = false
disable_error_code = [
    "arg-type",
    "index",
    "call-overload",
    "union-attr",
    "type-arg",
    "return-value",
]
